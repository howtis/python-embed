plugins {
    id 'io.github.howtis.python-embed'
}

version = project.findProperty('releaseVersion') ?: '1.0.2-SNAPSHOT'

dependencies {
    implementation 'org.msgpack:msgpack-core:0.9.12'
    implementation 'org.slf4j:slf4j-api:2.0.18'

    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.slf4j:slf4j-simple:2.0.18'
}

test {
    useJUnitPlatform()
}

pythonEmbed {
    packages = [
        'msgpack'
    ]
}

// This module is the library published to Maven Central, so its artifact must
// stay platform-neutral. The venv built here is a Linux/Windows-specific tree
// with absolute paths baked in; it is useful for this module's own tests (which
// run against the build output on the classpath) but is wrong to publish.
tasks.named('jar', Jar) {
    exclude('python-venv/**')
    exclude('META-INF/python-embed.properties')
}
